# ─── JVM Build Performance ───────────────────────────────────────────────────
# Increased heap for large projects (was 8G, trim to 4G for stability)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# ─── Gradle Daemon & Parallel Execution ──────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ─── AndroidX ────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ─── R8 Full Mode (aggressive dead code elimination & shrinking) ──────────────
# Reduces APK size significantly and improves startup time
android.enableR8.fullMode=true

# ─── Native Libs Uncompressed (improves install & runtime loading) ────────────
android.bundle.enableUncompressedNativeLibs=true

# ─── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.version=2.0
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# ─── Suppress non-critical warnings in CI ────────────────────────────────────
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings
