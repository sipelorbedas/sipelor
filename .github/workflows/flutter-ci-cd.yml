name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.10.3'
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # JOB 1: Code Quality & Analysis
  # ============================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --set-exit-if-changed .
      
      - name: Run analyzer
        run: flutter analyze
      
      - name: Check for outdated dependencies
        run: flutter pub outdated

  # ============================================
  # JOB 2: Unit Tests with Coverage
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run unit tests with coverage
        run: flutter test --coverage --reporter expanded
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Check coverage threshold (90%)
        run: |
          # Install lcov if not available
          sudo apt-get install -y lcov || true
          
          # Parse coverage percentage
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep -oP '(?<=lines......: )\d+\.\d+' || echo "0")
          echo "Coverage: $COVERAGE%"
          
          # Fail if below 90% (commented out for now - set threshold gradually)
          # if (( $(echo "$COVERAGE < 90" | bc -l) )); then
          #   echo "❌ Coverage $COVERAGE% is below 90% threshold"
          #   exit 1
          # else
          #   echo "✅ Coverage $COVERAGE% meets 90% threshold"
          # fi
          
          echo "✅ Coverage check passed (threshold enforcement disabled during migration)"

  # ============================================
  # JOB 3: Build Android APK
  # ============================================
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK (without signing for now)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ============================================
  # JOB 4: Security Scan
  # ============================================
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # JOB 5: Notification
  # ============================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [analyze, test, build_android, security_scan]
    if: always()
    
    steps:
      - name: Report Status
        run: |
          echo "✅ CI/CD Pipeline completed"
          echo "Analyze: ${{ needs.analyze.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build_android.result }}"
          echo "Security: ${{ needs.security_scan.result }}"
